[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoloop-building-agents"
version = "0.1.0"
description = "Autonomous closed-loop building-energy control: EnergyPlus digital twin supervised by a local LLM over MCP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EcoLoop" }]
license = { text = "MIT" }

# Runtime deps are pinned in requirements.txt (pyenergyplus is NOT on PyPI —
# it ships inside the EnergyPlus install). We keep loose ranges here so the
# package remains installable in editable mode without fighting the pins.
dependencies = [
    "eppy>=0.5.63",
    "pythermalcomfort>=2.10.0",
    "ollama>=0.3.3",
    "mcp>=1.2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26,<2",
    "pyyaml>=6",
    "pydantic>=2.9",
    "tenacity>=9",
    "rich>=13.9",
    "streamlit>=1.39",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
